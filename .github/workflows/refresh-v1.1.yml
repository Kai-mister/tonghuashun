name: Refresh v1.1 assets
on:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-v1.1.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          python3 -m unittest discover -s tests -v
          mkdir -p /tmp/watch-tests
          javac -d /tmp/watch-tests android/src/cn/local/simmanager/WatchSchedule.java tests/java/WatchScheduleTest.java
          java -cp /tmp/watch-tests cn.local.simmanager.WatchScheduleTest
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          from phone.backend import bundle, FILES
          with zipfile.ZipFile('android/dist/sim-manager.apk') as apk:
              assert json.loads(apk.read('assets/backend.json')) == bundle(Path('.'))
          with zipfile.ZipFile('ths-sim-upgrade.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in (*FILES, 'android/dist/sim-manager.apk', 'scripts/upgrade-phone.sh', 'scripts/bootstrap-phone.py', 'README.md'):
                  archive.write(name)
          PY
          cat > /tmp/release-notes.txt <<'NOTES'
          Android 模拟仓管家 v1.1（替换附件，版本号不变）。

          - 新增通知栏前台值守；退出界面后继续检查后台。
          - 工作日 09:14、12:59 提前唤醒，交易时段保持 CPU 运行并每分钟通过系统可见精确闹钟兜底（不响铃）。
          - 显示精确定时、电池优化、通知、锁屏及最近后台检查状态，提供系统设置入口。
          - 30 秒后台唤醒自检只读取状态，不触发补单。
          - 后台管理服务可连接时，恢复已退出的执行进程/UI 服务；尊重暂停状态，不擅自补单。
          - 保留四页导航、默认值显示、后台版本校验与 App 内后台更新，以及按已核实成交管理策略仓位。

          请允许精确定时、后台运行和通知，按厂商设置解除后台限制。一加/OPPO 还必须进入“应用详情 → 耗电管理 → 完全允许后台行为”并确认，单独电池豁免不够。安全密码锁屏不能自动解开；强行停止、重启、断网仍需检查恢复。重启后 App 能恢复值守检查，但原 ADB shell 执行器可能需 USB 恢复。隔夜可靠性仍需在目标设备实测。

          已支持 App 内更新的手机：安装 APK 后打开，按提示更新后台。旧后台仍须先使用 ths-sim-upgrade.zip 完成一次 USB 升级。全新手机需部署执行环境并配对。
          NOTES
          printf '\n附件源码提交：%s\n' "$GITHUB_SHA" >> /tmp/release-notes.txt
          gh release upload v1.1 android/dist/sim-manager.apk ths-sim-upgrade.zip --clobber
          gh release edit v1.1 --notes-file /tmp/release-notes.txt --latest
