name: Consolidate v1.1 release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/consolidate-v1.1.yml']
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          zip -q ths-sim-upgrade.zip android/dist/sim-manager.apk strategy_settings.py premarket.py strategy_worker.py phone/manager.py phone/local.py ths/simulator.py scripts/upgrade-phone.sh README.md
          gh release upload v1.1 android/dist/sim-manager.apk ths-sim-upgrade.zip --clobber
          gh release edit v1.1 --latest
          gh release delete v1.1.1 --cleanup-tag --yes
